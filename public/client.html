<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="X-Frame-Options" content="DENY">
<title>Tu Live Shop · Mi Bolsita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f172a;
  --bg-gradient: radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.15) 0%, transparent 40%);
  --surface: rgba(30, 41, 59, 0.65);
  --surface-hover: rgba(51, 65, 85, 0.8);
  --border: rgba(255, 255, 255, 0.08);
  --brand: #3b82f6;
  --brand-hover: #2563eb;
  --brand-glow: rgba(59, 130, 246, 0.4);
  --text: #f8fafc;
  --text-muted: #94a3b8;
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
  --ok: #22c55e; --warn: #f59e0b; --danger: #ef4444;
}
[data-theme="light"] {
  --bg: #f0f9ff;
  --bg-gradient: radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.1) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.1) 0%, transparent 40%);
  --surface: rgba(255, 255, 255, 0.7);
  --surface-hover: rgba(255, 255, 255, 0.9);
  --border: rgba(0, 0, 0, 0.08);
  --brand: #0284c7;
  --brand-hover: #0369a1;
  --brand-glow: rgba(2, 132, 199, 0.3);
  --text: #0f172a;
  --text-muted: #475569;
  --shadow: 0 8px 32px rgba(2, 132, 199, 0.1);
}
* { box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  background-image: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--text);
  margin: 0;
  min-height: 100vh;
}
.glass {
  background: var(--surface);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
}
header {
  position: sticky; top: 0; z-index: 100;
  padding: 16px 24px;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;
}
.brand { font-size: 20px; font-weight: 800; text-decoration: none; color: var(--text); display: flex; align-items: center; gap: 8px; }
.brand span { color: var(--brand); }
.nav-right { display: flex; gap: 12px; align-items: center; }
.btn {
  padding: 10px 20px; border-radius: 12px; font-weight: 600; font-size: 14px;
  text-decoration: none; cursor: pointer; transition: all 0.2s ease; border: none; display: inline-flex; align-items: center; gap: 8px;
}
.btn-primary { background: var(--brand); color: #fff; box-shadow: 0 4px 14px var(--brand-glow); }
.btn-primary:hover { background: var(--brand-hover); transform: translateY(-1px); }
.btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
.btn-ghost:hover { color: var(--text); background: var(--surface-hover); }
.btn-danger { background: var(--danger); color: #fff; }
.theme-toggle {
  width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
}
main { max-width: 900px; margin: 0 auto; padding: 40px 24px 80px; }
h1 { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
.subtitle { color: var(--text-muted); margin-bottom: 32px; }
.panel { padding: 24px; border-radius: 20px; margin-bottom: 20px; }
.panel h2 { font-size: 18px; font-weight: 700; margin: 0 0 16px; }
.bolsita { padding: 20px; border-radius: 16px; margin-bottom: 16px; border: 1px solid var(--border); background: var(--surface); }
.bolsita-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
.bolsita-num { font-family: 'Inter'; font-size: 18px; font-weight: 800; color: var(--brand); }
.badge { padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; }
.badge-ok { background: rgba(34, 197, 94, 0.15); color: #22c55e; }
.badge-warn { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
.badge-muted { background: rgba(148, 163, 184, 0.15); color: #94a3b8; }
.badge-danger { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
table { width: 100%; border-collapse: collapse; margin: 12px 0; }
th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
th { color: var(--text-muted); font-size: 12px; text-transform: uppercase; font-weight: 600; }
.totals { display: flex; gap: 20px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; font-weight: 700; }
.totals .saldo { color: var(--danger); }
.empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.empty .big { font-size: 56px; margin-bottom: 12px; }
.toast {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  background: var(--surface); color: var(--text); padding: 12px 20px;
  border-radius: 12px; font-weight: 700; font-size: 14px; z-index: 400;
  box-shadow: var(--shadow); border: 1px solid var(--border);
  opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.toast.show { opacity: 1; }
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
  display: none; align-items: center; justify-content: center; z-index: 200; padding: 16px;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: var(--surface); backdrop-filter: blur(20px);
  border: 1px solid var(--border); border-radius: 20px;
  padding: 32px; width: min(420px, 100%); box-shadow: var(--shadow);
}
.modal-box h3 { font-size: 20px; margin-bottom: 16px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-muted); }
.form-group input {
  width: 100%; padding: 12px 14px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--bg);
  color: var(--text); font-size: 14px; font-family: inherit;
}
.modal-actions { display: flex; gap: 10px; margin-top: 20px; }
.modal-actions .btn { flex: 1; justify-content: center; }
.bolsita-actions { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.bolsita-actions .review { color: var(--warn); font-weight: 700; font-size: 13px; }
.btn-wa { background: #16a34a; color: #fff; box-shadow: 0 4px 14px rgba(22,163,74,.35); }
.btn-wa:hover { background: #15803d; transform: translateY(-1px); }
.btn[disabled] { opacity: .55; cursor: not-allowed; transform: none; }
.pay-box { text-align: left; max-height: 92vh; overflow-y: auto; }
.pay-sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; font-size: 12px; color: var(--text-muted); text-align: center; }
.pay-sum b { display: block; font-size: 15px; color: var(--text); margin-top: 2px; }
.pay-sum .saldo b { color: var(--danger); }
.pay-step { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 14px; font-size: 14px; line-height: 1.4; }
.pay-step .n { flex: 0 0 24px; height: 24px; border-radius: 50%; background: var(--brand); color: #fff; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center; }
.pay-key { display: flex; align-items: center; gap: 8px; margin-top: 6px; padding: 10px 12px; border-radius: 10px; border: 1px dashed var(--brand); background: var(--bg); }
.pay-copy { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
.pay-key code { flex: 1; font-size: 17px; font-weight: 800; letter-spacing: .03em; word-break: break-all; }
.pay-key button { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
.pay-amt { display: flex; gap: 8px; margin-top: 6px; }
.pay-amt input { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit; font-size: 18px; font-weight: 800; }
.pay-amt button { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 10px; padding: 0 12px; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.pay-err { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 8px; text-align: center; }
.pay-warn { background: rgba(245,158,11,.14); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: 13px; font-weight: 600; margin-bottom: 12px; }
.pay-done { text-align: center; }
.pay-done .big { font-size: 46px; margin-bottom: 6px; }
.tabs { display: flex; gap: 8px; margin: 0 0 20px; flex-wrap: wrap; }
.tab { padding: 10px 18px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; }
.tab.active { background: var(--brand); color: #fff; border-color: var(--brand); box-shadow: 0 4px 14px var(--brand-glow); }
.tab .cnt { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 999px; background: rgba(255,255,255,.22); font-size: 12px; }
.shop-bar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.shop-bar input, .shop-bar select { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit; font-size: 14px; }
.shop-count { color: var(--text-muted); font-size: 13px; margin-bottom: 12px; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; margin-bottom: 28px; }
.pcard { display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); }
.pcard img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; background: var(--bg); }
.pcard .cat { font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--text-muted); text-transform: uppercase; }
.pcard .name { font-weight: 700; font-size: 15px; line-height: 1.25; }
.pcard .comp { font-size: 12px; color: var(--text-muted); }
.pcard .price { font-size: 18px; font-weight: 800; color: var(--brand); }
.pcard .stock { font-size: 12px; font-weight: 700; color: var(--ok); }
.pcard .stock.low { color: var(--warn); }
.pcard .btn { margin-top: auto; justify-content: center; }
.btn-sm { padding: 8px 14px; font-size: 13px; }
.user-chip { font: inherit; font-weight: 700; background: none; border: 0; color: var(--text); cursor: pointer; padding: 6px 10px; border-radius: 999px; }
.user-chip:hover { background: rgba(127,127,127,.15); }
.bagbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px; margin: 0 0 18px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); }
.bagbar .info { flex: 1; min-width: 180px; font-size: 14px; }
.bagbar .info b { font-weight: 800; }
.bagbar .saldo { color: var(--danger); font-weight: 800; }
.bolsita-date { font-size: 12px; color: var(--text-muted); margin-left: 8px; }
.bolsita-actions { justify-content: flex-start; }
.btn[disabled], .btn.is-locked { opacity: .5; cursor: not-allowed; transform: none; }
.rm { border: 0; background: var(--danger); color: #fff; border-radius: 8px; padding: 4px 9px; cursor: pointer; font-weight: 700; }
@media (max-width: 640px) {
  .shop-bar { grid-template-columns: 1fr; }
  .hm { display: none; }
  .bolsita { padding: 14px; }
  .bolsita th, .bolsita td { padding: 8px 6px; }
  .pgrid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  header { padding: 12px 16px; }
  .nav-right { width: 100%; justify-content: center; }
  main { padding: 24px 16px 60px; }
}
</style>

<body>

<header class="glass">
  <a href="#" class="brand" onclick="openStorePicker();return false" title="Mis tiendas">🛍️ Tu <span>Live Shop</span></a>
  <div class="nav-right">
    <button class="theme-toggle" onclick="toggleTheme()" title="Cambiar tema" id="themeBtn">🌙</button>
    <select id="storeSwitch" onchange="switchStore(this.value)" title="Cambiar de tienda" style="display:none;max-width:160px;padding:6px 8px;border-radius:10px"></select>
    <button type="button" id="userName" class="user-chip" onclick="openProfile()" title="Ver y editar mis datos"></button>
    <button class="btn btn-ghost" onclick="logout()">Salir</button>
  </div>
</header>

<main>
  <section id="view-login" class="view active">
    <div style="max-width:420px;margin:60px auto">
      <h1 style="text-align:center">🛍️ Mi Bolsita</h1>
      <p class="subtitle" style="text-align:center">Accede con tu WhatsApp y PIN</p>
      <form class="panel glass" onsubmit="clientLogin(event)" style="display:grid;gap:12px">
        <div class="form-group">
          <label>Tienda</label>
          <select id="lStore" required>
            <option value="">Selecciona...</option>
            <option value="ttshop">Pandala Kawaii</option>
          </select>
        </div>
        <div class="form-group">
          <label>WhatsApp</label>
          <input id="lWa" type="text" inputmode="numeric" placeholder="3001234567" required>
        </div>
        <div class="form-group">
          <label>PIN</label>
          <input id="lPin" type="password" inputmode="numeric" placeholder="••••" minlength="4" required>
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center">Ingresar</button>
        <div id="lErr" style="color:var(--danger);font-size:13px;text-align:center"></div>
        <p style="text-align:center;font-size:13px;color:var(--text-muted);margin-top:8px">
          ¿Primera vez? Tu PIN inicial es <b>1234</b>.
        </p>
      </form>
    </div>
  </section>

  <section id="view-dashboard" class="view" style="display:none">
    <h1 id="storeTitle">🛍️ Tienda</h1>
    <p class="subtitle">Hola, <span id="welcomeName"></span>.</p>
    <div class="tabs">
      <button class="tab active" id="tabBtn-shop" onclick="setTab('shop')">🛍️ Tienda</button>
      <button class="tab" id="tabBtn-orders" onclick="setTab('orders')"><span id="bagsIconTxt">🛍️</span> <span id="bagsLabelTxt">Mis bolsitas</span><span class="cnt" id="bagCnt" style="display:none"></span></button>
    </div>
    <div class="bagbar" id="bagBar" style="display:none"></div>

    <div id="tab-shop">
      <div class="shop-bar">
        <input id="shopSearch" type="search" placeholder="🔎 Buscar producto o código" oninput="renderCatalog()">
        <select id="shopCat" onchange="renderCatalog()"><option value="">Todas las categorías</option></select>
        <select id="shopSort" onchange="renderCatalog()">
          <option value="alpha">Orden: A–Z</option>
          <option value="priceAsc">Precio: menor a mayor</option>
          <option value="priceDesc">Precio: mayor a menor</option>
          <option value="avail">Más disponibles</option>
        </select>
      </div>
      <div class="shop-count" id="shopCount"></div>
      <div class="pgrid" id="catalog"></div>
      <div id="kitsBox" style="display:none">
        <h2 style="font-size:18px;margin:6px 0 12px">🎁 Kits</h2>
        <div class="pgrid" id="kits"></div>
      </div>
    </div>

    <div id="tab-orders" style="display:none">
      <div id="ordersList"></div>
    </div>
  </section>
</main>

<!-- Modal mis datos -->
<div class="modal-overlay" id="profileModal" onclick="if(event.target===this)closeProfile()">
  <div class="modal-box" style="text-align:left">
    <h3>👤 Mis datos</h3>
    <p style="color:var(--text-muted);font-size:13px;margin:-6px 0 14px">Se actualizan en todas las tiendas donde estás inscrito.</p>
    <div class="form-group"><label>Nombre completo</label><input id="pfName" maxlength="100"></div>
    <div class="form-group"><label>WhatsApp (tu llave de ingreso)</label><input id="pfWa" readonly style="opacity:.7"></div>
    <div class="form-group"><label>Correo electrónico</label><input id="pfEmail" type="email" maxlength="120"></div>
    <div class="form-row">
      <div class="form-group"><label>Ciudad</label><input id="pfCity" maxlength="100"></div>
      <div class="form-group"><label>Dirección de envío</label><input id="pfAddr" maxlength="300"></div>
    </div>
    <div class="pay-err" id="pfErr"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" onclick="closeProfile()">Cancelar</button>
      <button type="button" class="btn btn-primary" id="pfSave" onclick="saveProfile()">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal cambio de PIN -->
<div class="modal-overlay" id="storesModal">
  <div class="modal-box" style="text-align:center">
    <h3>🏪 Mis tiendas</h3>
    <div id="storesView"></div>
    <button class="btn" style="margin-top:14px;width:100%;justify-content:center" onclick="$('storesModal').classList.remove('open')">Cerrar</button>
  </div>
</div>

<!-- Modal reportar pago (Bre-B + WhatsApp) -->
<div class="modal-overlay" id="payModal" onclick="if(event.target===this)closePay()">
  <div class="modal-box pay-box" id="payBody"></div>
</div>

<div class="modal-overlay" id="pinModal">
  <div class="modal-box">
    <h3>🔐 Cambia tu PIN</h3>
    <p style="color:var(--text-muted);font-size:14px;margin-bottom:16px">Por seguridad, debes crear un nuevo PIN antes de continuar.</p>
    <form onsubmit="changePin(event)">
      <div class="form-group">
        <label>Nuevo PIN (6 a 8 dígitos)</label>
        <input id="newPin" type="password" inputmode="numeric" title="El PIN debe tener de 6 a 8 dígitos, solo números" pattern="[0-9]{6,8}" minlength="6" maxlength="8" placeholder="Solo números" autocomplete="new-password" required>
      </div>
      <div class="form-group">
        <label>Confirma el PIN</label>
        <input id="newPin2" type="password" inputmode="numeric" title="El PIN debe tener de 6 a 8 dígitos, solo números" pattern="[0-9]{6,8}" minlength="6" maxlength="8" autocomplete="new-password" required>
      </div>
      <div id="pinErr" style="color:var(--danger);font-size:13px;text-align:center"></div>
      <div class="modal-actions">
        <button type="submit" class="btn btn-primary">Guardar PIN</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="/wallets.js?v=1"></script>
<script src="/client-invoice.js"></script>
<script>
let token = localStorage.getItem('pk_token') || '';
let user = JSON.parse(localStorage.getItem('pk_user') || 'null');
let slug = new URLSearchParams(location.search).get('t') || localStorage.getItem('pk_slug') || 'ttshop';

const $ = id => document.getElementById(id);
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 3000);
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    credentials: 'include',
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}), ...(opts.headers || {}) },
    body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Error ' + res.status);
  return data;
}

const STATUS = { draft: 'Borrador', pending_confirm: 'Por confirmar', apartada: 'Apartada', paid: 'Pagada', shipped: 'Enviada', delivered: 'Entregada', canceled: 'Cancelada', expired: 'Vencida' };
const STATUS_CLASS = { draft: 'badge-warn', pending_confirm: 'badge-warn', apartada: 'badge-warn', paid: 'badge-ok', shipped: 'badge-ok', delivered: 'badge-ok', canceled: 'badge-danger', expired: 'badge-danger' };
const money = n => new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(Number(n) || 0);

function init() {
  const saved = localStorage.getItem('theme');
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = saved || (prefersDark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
  $('themeBtn').textContent = theme === 'dark' ? '🌙' : '☀️';

  if (user && token) showDashboard();
  else showLogin();
}

function showLogin() {
  location.replace('/?login=client'); // el acceso de clientes vive en la página principal
}

function showDashboard() {
  $('view-login').style.display = 'none';
  $('view-dashboard').style.display = 'block';
  $('userName').textContent = '👋 ' + (user.name || 'Cliente');
  renderStoreSwitch();
  $('welcomeName').textContent = user.name || 'Cliente';
  const cur = myStores().find(x => x.slug === slug);
  $('storeTitle').textContent = '🛍️ ' + (cur && cur.name && cur.name !== cur.slug ? cur.name : 'Tienda');
  loadCfg();
  loadCatalog();
  loadOrders();
  if (user.must_change_pin) $('pinModal').classList.add('open');
}

async function clientLogin(e) {
  e.preventDefault();
  $('lErr').textContent = '';
  try {
    const d = await api('/api/auth/client/login', { method: 'POST', body: { whatsapp: $('lWa').value, pin: $('lPin').value, portfolio_slug: $('lStore').value } });
    token = d.token; user = d.user; slug = d.portfolio.slug;
    localStorage.setItem('pk_token', token);
    localStorage.setItem('pk_user', JSON.stringify(user));
    localStorage.setItem('pk_slug', slug);
    showDashboard();
  } catch (e) { $('lErr').textContent = e.message; }
}

function logout() {
  fetch('/api/auth/logout', { method: 'POST', credentials: 'include' }).catch(() => {});
  token = ''; user = null;
  ['pk_token', 'pk_user', 'pk_slug', 'pk_stores'].forEach(k => localStorage.removeItem(k));
  location.replace('/?login=client');
}

/* ---------- Selector de tiendas (clic en "Tu Live Shop") ---------- */
const escH = (t) => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function myStores() {
  const st = getStores();
  if (st.length) return st;
  return slug && token ? [{ slug, name: slug, token, user }] : [];
}
function openStorePicker() {
  const st = myStores();
  $('storesView').innerHTML = '<p style="color:var(--text-muted);margin-bottom:12px">Elige la tienda a la que quieres entrar:</p>' +
    st.map(s => `<button class="btn ${s.slug === slug ? 'btn-primary' : 'btn-ghost'}" style="width:100%;justify-content:center;margin-bottom:8px" onclick="switchStore('${escH(s.slug)}')">🏪 ${escH(s.name)}${s.slug === slug ? ' (actual)' : ''}</button>`).join('') +
    '<button class="btn btn-ghost" style="width:100%;justify-content:center;margin-top:6px;border:1px dashed var(--border)" onclick="showNewStores()">➕ Registrarme en una nueva tienda</button>';
  $('storesModal').classList.add('open');
}
async function showNewStores() {
  $('storesView').innerHTML = '<p style="color:var(--text-muted)">Cargando tiendas…</p>';
  try {
    const all = await api('/api/auth/client/portfolios');
    const mine = new Set(myStores().map(s => s.slug));
    const free = all.filter(p => !mine.has(p.slug));
    $('storesView').innerHTML = free.length
      ? '<p style="color:var(--text-muted);margin-bottom:10px">Marca las tiendas donde quieres comprar:</p><div style="text-align:left;max-height:260px;overflow:auto;margin-bottom:12px">' +
        free.map(p => `<label style="display:flex;gap:10px;align-items:center;padding:8px 4px"><input type="checkbox" class="nsChk" value="${escH(p.slug)}"> 🏪 ${escH(p.name)}</label>`).join('') +
        '</div><div id="nsErr" style="color:var(--danger);font-size:13px;min-height:18px"></div><button class="btn btn-primary" style="width:100%;justify-content:center" onclick="addNewStores()">Registrarme</button>' +
        '<button class="link-text" style="background:none;border:0;color:var(--brand);margin-top:10px;cursor:pointer" onclick="openStorePicker()">← Volver</button>'
      : '<p style="color:var(--text-muted)">Ya estás inscrito en todas las tiendas disponibles. ✔</p><button class="link-text" style="background:none;border:0;color:var(--brand);margin-top:10px;cursor:pointer" onclick="openStorePicker()">← Volver</button>';
  } catch (e) { $('storesView').innerHTML = '<p style="color:var(--danger)">' + escH(e.message) + '</p>'; }
}
async function addNewStores() {
  const picks = [...document.querySelectorAll('.nsChk:checked')].map(c => c.value);
  if (!picks.length) { $('nsErr').textContent = 'Selecciona al menos una tienda.'; return; }
  try {
    const r = await api('/api/auth/client/add-stores', { method: 'POST', body: { portfolios: picks } });
    const merged = myStores().slice();
    (r.added || []).forEach(n => { if (!merged.find(x => x.slug === n.slug)) merged.push(n); });
    localStorage.setItem('pk_stores', JSON.stringify(merged));
    toast && toast('✔ Te registraste en ' + (r.added || []).length + ' tienda(s)');
    openStorePicker();
    renderStoreSwitch();
  } catch (e) { $('nsErr').textContent = e.message; }
}

/* ---------- Varias tiendas ---------- */
function getStores() { try { return JSON.parse(localStorage.getItem('pk_stores') || '[]'); } catch (e) { return []; } }
function renderStoreSwitch() {
  const stores = getStores(), sel = $('storeSwitch');
  if (!sel || stores.length < 2) return;
  sel.innerHTML = stores.map(s => `<option value="${String(s.slug).replace(/"/g, '&quot;')}" ${s.slug === slug ? 'selected' : ''}>🏪 ${String(s.name).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))}</option>`).join('');
  sel.style.display = '';
}
function switchStore(newSlug) {
  const s = getStores().find(x => x.slug === newSlug);
  if (!s) return;
  localStorage.setItem('pk_token', s.token);
  localStorage.setItem('pk_user', JSON.stringify(s.user));
  localStorage.setItem('pk_slug', s.slug);
  location.href = '/client.html?t=' + encodeURIComponent(s.slug);
}
// Tras cambiar el PIN, las tiendas que el servidor actualizó ya no piden cambiarlo otra vez
function markPinChanged(ids) {
  const stores = getStores();
  stores.forEach(s => { if (ids.includes(s.user.id)) s.user.must_change_pin = false; });
  localStorage.setItem('pk_stores', JSON.stringify(stores));
}

/* ---------- Tienda (catálogo) ---------- */
let PRODUCTS = [], KITS = [], CATS = [], ORDERS = [];
const ACTIVE = ['draft', 'pending_confirm', 'apartada'];
function setTab(t) {
  ['shop', 'orders'].forEach(k => {
    $('tab-' + k).style.display = k === t ? 'block' : 'none';
    $('tabBtn-' + k).classList.toggle('active', k === t);
  });
  if (t === 'orders') loadOrders();
}
async function loadCatalog() {
  $('catalog').innerHTML = '<p style="color:var(--text-muted)">Cargando productos…</p>';
  try {
    const [p, k, c] = await Promise.all([
      api('/api/products/portfolio/' + encodeURIComponent(slug)),
      api('/api/products/kits/' + encodeURIComponent(slug)),
      api('/api/products/categories/' + encodeURIComponent(slug)),
    ]);
    PRODUCTS = p; KITS = k; CATS = c;
    const sel = $('shopCat'), prev = sel.value;
    sel.innerHTML = '<option value="">Todas las categorías</option>' + CATS.map(x => `<option value="${escH(x.name)}">${escH(x.name)}</option>`).join('');
    sel.value = prev;
    renderCatalog();
  } catch (e) {
    $('catalog').innerHTML = '<p style="color:var(--danger)">No se pudo cargar la tienda: ' + escH(e.message) + '</p>';
  }
}
function renderCatalog() {
  const q = ($('shopSearch').value || '').toLowerCase().trim(), cat = $('shopCat').value, mode = $('shopSort').value;
  let list = PRODUCTS.filter(p => Number(p.available) > 0 && (!cat || (p.category || '') === cat) &&
    (!q || String(p.name).toLowerCase().includes(q) || String(p.code || '').toLowerCase().includes(q)));
  list.sort((a, b) => mode === 'priceAsc' ? Number(a.price) - Number(b.price) : mode === 'priceDesc' ? Number(b.price) - Number(a.price)
    : mode === 'avail' ? Number(b.available) - Number(a.available) : String(a.name).localeCompare(String(b.name), 'es'));
  $('shopCount').textContent = list.length + ' producto(s) disponible(s)';
  $('catalog').innerHTML = list.length ? list.map(p => `<div class="pcard">
      ${p.image_url ? `<img src="${escH(p.image_url)}" alt="" loading="lazy">` : ''}
      <div class="cat">${escH(p.category || 'Sin categoría')}</div>
      <div class="name">${escH(p.name)}</div>
      <div class="price">${money(p.price)}</div>
      <div class="stock ${Number(p.available) <= 2 ? 'low' : ''}">Disponibles: ${Number(p.available)}</div>
      <button class="btn btn-primary" onclick="addToBag('product','${escH(p.id)}',this)">Agregar</button></div>`).join('')
    : '<p style="color:var(--text-muted)">No hay productos disponibles con esos filtros.</p>';
  const ks = KITS.filter(k => Number(k.available) > 0);
  $('kitsBox').style.display = ks.length ? 'block' : 'none';
  $('kits').innerHTML = ks.map(k => `<div class="pcard">
      <div class="cat">Kit</div><div class="name">🎁 ${escH(k.name)}</div>
      <div class="comp">${(k.components || []).map(c => Number(c.quantity) + '× ' + escH(c.product_name)).join(' · ')}</div>
      <div class="price">${money(k.price)}</div>
      <div class="stock ${Number(k.available) <= 2 ? 'low' : ''}">Disponibles: ${Number(k.available)}</div>
      <button class="btn btn-primary" onclick="addToBag('kit','${escH(k.id)}',this)">Agregar</button></div>`).join('');
}
async function addToBag(kind, id, btn) {
  const body = kind === 'kit' ? { kit_id: id, quantity: 1 } : { product_id: id, quantity: 1 };
  if (btn) btn.disabled = true;
  try {
    let o = await api('/api/orders', { method: 'POST' });
    try { await api('/api/orders/' + o.id + '/items', { method: 'POST', body }); }
    catch (e) {
      if (!/no encontrada|ya no puede modificarse/i.test(e.message)) throw e;
      o = await api('/api/orders', { method: 'POST' });
      await api('/api/orders/' + o.id + '/items', { method: 'POST', body });
    }
    toast('✔ Agregado a tu bolsita');
  } catch (e) { toast('⚠ ' + e.message); }
  await Promise.all([loadCatalog(), loadOrders(true)]);   // refresca el stock real y la bolsita
}
async function removeFromBag(orderId, itemId) {
  try { await api('/api/orders/' + orderId + '/items/' + itemId, { method: 'DELETE' }); toast('Producto quitado'); }
  catch (e) { toast('⚠ ' + e.message); }
  await Promise.all([loadCatalog(), loadOrders(true)]);
}

async function loadOrders(quiet) {
  try {
    const orders = await api('/api/orders/mine');
    ORDERS = orders || [];
    const cur = ORDERS.filter(o => ACTIVE.includes(o.status)).sort((a, b) => String(a.created_at).localeCompare(String(b.created_at)))[0];
    const n = cur ? (cur.items || []).reduce((a, i) => a + Number(i.quantity), 0) : 0;
    $('bagCnt').textContent = n; $('bagCnt').style.display = n ? '' : 'none';
    renderBagBar(cur);
    if (!orders || !orders.length) {
      renderBagBar(null);
      $('ordersList').innerHTML = '<div class="empty"><div class="big">' + bagsIcon() + '</div>Aún no tienes pedidos.<br><button class="btn btn-primary" style="margin-top:16px" onclick="setTab(\'shop\')">Ir a la tienda</button></div>';
      return;
    }
    $('ordersList').innerHTML = orders.map(o => {
      const items = (o.items || []).map(i => `<tr><td>${escH(i.product_name || i.kit_name || '—')}</td><td>${i.quantity}</td><td class="hm">${money(i.price)}</td><td>${money(i.price * i.quantity)}</td><td>${o.status === 'draft' ? `<button class="rm" title="Quitar" onclick="removeFromBag('${escH(o.id)}','${escH(i.id)}')">✕</button>` : ''}</td></tr>`).join('');
      return `<div class="bolsita">
        <div class="bolsita-header">
          <span><span class="bolsita-num">${escH(o.order_number)}</span><span class="bolsita-date">${fmtDMY(o.created_at)}</span></span>
          <span class="badge ${STATUS_CLASS[o.status] || 'badge-muted'}">${STATUS[o.status] || o.status}</span>
        </div>
        <table><thead><tr><th>Producto</th><th>Cant.</th><th class="hm">Precio</th><th>Total</th><th></th></tr></thead><tbody>${items || '<tr><td colspan="5" style="text-align:center;color:var(--text-muted)">Sin productos</td></tr>'}</tbody></table>
        <div class="totals">
          <span>Total: ${money(o.total)}</span>
          <span>Abonado: ${money(o.paid)}</span>
          <span class="saldo">Saldo: ${money(o.balance)}</span>
        </div>
        ${orderActions(o)}
      </div>`;
    }).join('');
  } catch (e) {
    if (!quiet) $('ordersList').innerHTML = '<div class="empty">No se pudieron cargar tus bolsitas.</div>';
  }
}

/* ---------- Reportar pago: Bre-B + WhatsApp ---------- */
let PAY = null;
function closePay() { $('payModal').classList.remove('open'); PAY = null; loadOrders(true); }
async function copyKey() {
  const k = PAY && PAY.cfg && PAY.cfg.wallet && PAY.cfg.wallet.value; if (!k) return;
  try { await navigator.clipboard.writeText(k); toast('✔ Copiado'); }
  catch (_) { const r = document.createRange(); r.selectNodeContents($('payKey')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Selecciona y copia el dato'); }
}
function payFull() { $('payAmt').value = Number(PAY.o.balance).toLocaleString('es-CO'); }
function payAmtFmt(el) { const d = el.value.replace(/\D/g, ''); el.value = d ? Number(d).toLocaleString('es-CO') : ''; }

async function openPay(orderId) {
  const o = ORDERS.find(x => x.id === orderId); if (!o) return;
  PAY = { o, cfg: null };
  if (o.status === 'pending_confirm') return openResend(o);
  $('payBody').innerHTML = '<h3>💸 Reportar pago</h3><p style="color:var(--text-muted)">Cargando datos de la tienda…</p>';
  $('payModal').classList.add('open');
  try { PAY.cfg = await api('/api/products/config/' + encodeURIComponent(slug)); }
  catch (e) { $('payBody').innerHTML = `<h3>💸 Reportar pago</h3><div class="pay-warn">⚠ ${escH(e.message)}</div><div class="modal-actions"><button class="btn btn-ghost" onclick="closePay()">Cerrar</button></div>`; return; }
  renderPay();
}
function renderPay() {
  const { o, cfg } = PAY;
  const wl = cfg.wallet, key = String((wl && wl.value) || '').trim(), wa = String(cfg.whatsapp_number || '').replace(/\D/g, '');
  const warn = (!key ? '<div class="pay-warn">⚠ La tienda aún no configuró su medio de pago. Escríbele por otro medio.</div>' : '') +
               (!wa ? '<div class="pay-warn">⚠ La tienda aún no configuró su WhatsApp.</div>' : '');
  $('payBody').innerHTML = `
    <h3>💸 Reportar pago · ${escH(o.order_number)}</h3>
    <div class="pay-sum"><div>Total<b>${money(o.total)}</b></div><div>Abonado<b>${money(o.paid)}</b></div><div class="saldo">Saldo<b>${money(o.balance)}</b></div></div>
    ${warn}
    <div class="pay-step"><span class="n">1</span><div style="flex:1;min-width:0">Transfiere por <b>${escH(wl ? wl.name : 'billetera')}</b> a <b>${escH(cfg.name || 'la tienda')}</b>:
      ${wl ? `<div class="wcard" style="margin-top:6px">${Wallets.logo(wl.provider, wl.name, 52)}<div class="wtxt" style="flex:1"><div class="wname">${escH(wl.name)}</div><div class="wval" id="payKey">${escH(key)}</div></div><button type="button" class="pay-copy" onclick="copyKey()">Copiar</button></div>` : '<div class="pay-key"><code id="payKey">—</code></div>'}</div></div>
    <div class="pay-step"><span class="n">2</span><div style="flex:1;min-width:0">Escribe el monto que transferiste:
      <div class="pay-amt"><input id="payAmt" inputmode="numeric" autocomplete="off" placeholder="$ 0" value="${Number(o.balance).toLocaleString('es-CO')}" oninput="payAmtFmt(this)"><button type="button" onclick="payFull()">Saldo completo</button></div></div></div>
    <div class="pay-step"><span class="n">3</span><div>Toca <b>Reportar por WhatsApp</b>, envía el mensaje y <b>adjunta la captura del comprobante</b> en el chat. La tienda lo revisará y aprobará tu pago.</div></div>
    <div class="pay-err" id="payErr"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" onclick="closePay()">Cancelar</button>
      <button type="button" class="btn btn-wa" id="payGo" onclick="submitPay()" ${wa ? '' : 'disabled'}>Reportar por WhatsApp</button>
    </div>`;
}
async function submitPay() {
  const amount = Number(String($('payAmt').value).replace(/\D/g, '')) || 0;
  if (amount <= 0) { $('payErr').textContent = 'Escribe el monto que transferiste'; return; }
  const btn = $('payGo'); btn.disabled = true; $('payErr').textContent = '';
  try {
    const r = await api('/api/orders/' + PAY.o.id + '/separar', { method: 'POST', body: { amount } });
    if (!r.whatsapp_link) throw new Error('La tienda no tiene WhatsApp configurado');
    const w = window.open(r.whatsapp_link, '_blank');   // puede bloquearse tras el await: por eso el enlace queda visible abajo
    $('payBody').innerHTML = `<div class="pay-done"><div class="big">✅</div>
      <h3>Reporte registrado</h3>
      <p style="color:var(--text-muted);font-size:14px;line-height:1.5">Reportaste <b style="color:var(--text)">${money(amount)}</b>. Falta un paso: <b style="color:var(--text)">envía el mensaje por WhatsApp y adjunta la captura del comprobante</b>. Sin el soporte la tienda no puede aprobarlo.</p>
      <div class="modal-actions" style="flex-direction:column">
        <a class="btn btn-wa" href="${escH(r.whatsapp_link)}" target="_blank" rel="noopener">${w ? 'Abrir WhatsApp de nuevo' : 'Abrir WhatsApp'}</a>
        <button type="button" class="btn btn-ghost" onclick="closePay()">Listo</button>
      </div></div>`;
    loadOrders(true);
  } catch (e) {
    btn.disabled = false; $('payErr').textContent = e.message;
  }
}

/* ---------- Etiqueta configurable, fechas, barra de bolsita y acciones por pedido ---------- */
let CFG = null;
// Fecha y hora del servidor (timestamp) → dd-mm-aaaa en la hora local del cliente
const fmtDMY = (v) => { const d = new Date(v); return isNaN(d) ? '' : [String(d.getDate()).padStart(2, '0'), String(d.getMonth() + 1).padStart(2, '0'), d.getFullYear()].join('-'); };
const bagsLabel = () => (CFG && CFG.bags_label) || 'Mis bolsitas';
const bagsIcon = () => (CFG && typeof CFG.bags_icon === 'string') ? CFG.bags_icon : '🛍️';
function applyBagsLabel() {
  const t = $('bagsLabelTxt'); if (t) t.textContent = bagsLabel();
  const i = $('bagsIconTxt'); if (i) { i.textContent = bagsIcon(); i.style.display = bagsIcon() ? '' : 'none'; }
}
async function loadCfg() {
  try { CFG = await api('/api/products/config/' + encodeURIComponent(slug)); applyBagsLabel(); applyStoreTheme(); } catch (_) { /* usa la etiqueta por defecto */ }
}
// Colores de la tienda (sección Diseño del administrador); sin configurar = Opción A
function applyStoreTheme() {
  try {
    const th = TLSTheme.sanitize(CFG && CFG.theme);
    if (th) TLSTheme.apply(th); else TLSTheme.reset();
    TLSTheme.cacheSet(slug, th);
  } catch (_) {}
}
try { const th0 = TLSTheme.cacheGet(slug); if (th0) TLSTheme.apply(th0); } catch (_) {}

function renderBagBar(cur) {
  const b = $('bagBar'); if (!b) return;
  if (!cur || !(Number(cur.total) > 0)) { b.style.display = 'none'; return; }
  const n = (cur.items || []).reduce((a, i) => a + Number(i.quantity), 0);
  const pending = cur.status === 'pending_confirm';
  const canPay = !pending && ['draft', 'apartada'].includes(cur.status) && Number(cur.balance) > 0;
  b.innerHTML = `<div class="info">${bagsIcon() ? bagsIcon() + ' ' : ''}<b>${escH(cur.order_number)}</b> · ${n} producto${n === 1 ? '' : 's'} · Saldo <span class="saldo">${money(cur.balance)}</span>${pending ? ' · <span style="color:var(--warn);font-weight:700">⏳ pago en revisión</span>' : ''}</div>` +
    (pending ? `<button class="btn btn-wa btn-sm" onclick="openPay('${escH(cur.id)}')">📎 Reenviar comprobante</button>`
      : canPay ? `<button class="btn btn-wa btn-sm" onclick="openPay('${escH(cur.id)}')">💸 Reportar pago</button>` : '') +
    `<button class="btn btn-ghost btn-sm" onclick="setTab('orders')">Ver ${escH(bagsLabel().toLowerCase())}</button>`;
  b.style.display = 'flex';
}

function orderActions(o) {
  const total = Number(o.total), bal = Number(o.balance);
  const id = escH(o.id);
  const pending = o.status === 'pending_confirm';
  const canReport = pending || (['draft', 'apartada'].includes(o.status) && total > 0 && bal > 0);
  const closed = ['canceled', 'expired'].includes(o.status);
  const sent = ['shipped', 'delivered'].includes(o.status);
  const canShip = !closed && !sent && total > 0 && bal <= 0;
  const shipTitle = sent ? 'Esta bolsita ya fue enviada' : closed ? 'Bolsita cerrada' : canShip ? 'Pedir el envío por WhatsApp' : 'Disponible cuando la bolsita esté totalmente pagada';
  const reportTitle = canReport ? (pending ? 'Reenviar el comprobante a la tienda' : 'Reportar un pago') : 'Sin saldo pendiente';
  return `<div class="bolsita-actions">
    ${pending ? '<span class="review">⏳ Tu pago está en revisión</span>' : ''}
    <button class="btn btn-wa btn-sm" ${canReport ? '' : 'disabled'} title="${reportTitle}" onclick="openPay('${id}')">${pending ? '📎 Reenviar comprobante' : '💸 Reportar pago'}</button>
    <button class="btn btn-ghost btn-sm" ${total > 0 ? '' : 'disabled'} onclick="clientInvoice('${id}', this)">🧾 Generar factura</button>
    <button class="btn btn-ghost btn-sm" ${canShip ? '' : 'disabled'} title="${shipTitle}" onclick="waAction('${id}', 'shipping', this)">${sent ? '✅ Enviada' : '📦 Solicitar envío'}</button>
    <button class="btn btn-ghost btn-sm" onclick="waAction('${id}', 'help', this)">💬 Ayuda</button>
  </div>`;
}

// Abre el chat de WhatsApp de la tienda (se abre la pestaña al instante para que el navegador no la bloquee)
async function waAction(orderId, kind, btn) {
  const w = window.open('', '_blank');
  if (btn) btn.disabled = true;
  try {
    const r = await api('/api/orders/' + encodeURIComponent(orderId) + '/wa/' + kind);
    if (w) w.location.href = r.whatsapp_link; else location.href = r.whatsapp_link;
  } catch (e) { if (w) w.close(); toast('⚠ ' + e.message); }
  finally { if (btn) btn.disabled = false; }
}

// Pago ya reportado: vuelve a abrir WhatsApp con el mismo mensaje para enviar el comprobante
async function openResend(o) {
  $('payBody').innerHTML = '<h3>📎 Reenviar comprobante</h3><p style="color:var(--text-muted)">Cargando…</p>';

      <div class="modal-actions" style="flex-direction:column">
        <a class="btn btn-wa" href="${escH(r.whatsapp_link)}" target="_blank" rel="noopener">Abrir WhatsApp</a>
        <button type="button" class="btn btn-ghost" onclick="closePay()">Cerrar</button>
      </div></div>`;
  } catch (e) {
    $('payBody').innerHTML = `<h3>📎 Reenviar comprobante</h3><div class="pay-warn">⚠ ${escH(e.message)}</div><div class="modal-actions"><button class="btn btn-ghost" onclick="closePay()">Cerrar</button></div>`;

}

/* ---------- Mis datos ---------- */
async function openProfile() {
  $('pfErr').textContent = ''; $('profileModal').classList.add('open');
  try {
    const me = await api('/api/auth/client/me');
    $('pfName').value = me.name || ''; $('pfWa').value = me.whatsapp || '';
    $('pfEmail').value = me.email || ''; $('pfCity').value = me.city || ''; $('pfAddr').value = me.address || '';
  } catch (e) { $('pfErr').textContent = e.message; }
}
function closeProfile() { $('profileModal').classList.remove('open'); }
async function saveProfile() {
  const btn = $('pfSave'); btn.disabled = true; $('pfErr').textContent = '';
  try {
    const r = await api('/api/auth/client/me', { method: 'PUT', body: { name: $('pfName').value, email: $('pfEmail').value, city: $('pfCity').value, address: $('pfAddr').value } });
    user = { ...user, ...r.user };
    localStorage.setItem('pk_user', JSON.stringify(user));
    const stores = getStores();
    stores.forEach(st => { st.user = { ...st.user, name: r.user.name, email: r.user.email, city: r.user.city, address: r.user.address }; });
    if (stores.length) localStorage.setItem('pk_stores', JSON.stringify(stores));
    $('userName').textContent = '👋 ' + user.name; $('welcomeName').textContent = user.name;
    closeProfile(); toast('✔ Datos actualizados en ' + r.stores_updated + ' tienda' + (r.stores_updated === 1 ? '' : 's'));
  } catch (e) { $('pfErr').textContent = e.message; }
  finally { btn.disabled = false; }
}

document.addEventListener('visibilitychange', () => { if (!document.hidden && token && typeof loadOrders === 'function') loadOrders(true); });

async function changePin(e) {
  e.preventDefault();
  const a = $('newPin').value, b = $('newPin2').value;
  if (!/^\d{6,8}$/.test(a)) { $('pinErr').textContent = 'El PIN debe tener de 6 a 8 dígitos (solo números)'; return; }
  if (a !== b) { $('pinErr').textContent = 'Los PIN no coinciden'; return; }
  try {
    const r = await api('/api/auth/client/change-pin', { method: 'POST', body: { new_pin: a } });
    markPinChanged(r.updated || []);
    $('pinModal').classList.remove('open');
    toast('✔ PIN actualizado');
    user.must_change_pin = false;
    localStorage.setItem('pk_user', JSON.stringify(user));
  } catch (e) { $('pinErr').textContent = e.message; }
}

function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  $('themeBtn').textContent = next === 'dark' ? '🌙' : '☀️';
}

init();
</script>
