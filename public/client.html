<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="X-Frame-Options" content="DENY">
<title>Tu Live Shop · Mi Bolsita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f172a;
  --bg-gradient: radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.15) 0%, transparent 40%);
  --surface: rgba(30, 41, 59, 0.65);
  --surface-hover: rgba(51, 65, 85, 0.8);
  --border: rgba(255, 255, 255, 0.08);
  --brand: #3b82f6;
  --brand-hover: #2563eb;
  --brand-glow: rgba(59, 130, 246, 0.4);
  --text: #f8fafc;
  --text-muted: #94a3b8;
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
  --ok: #22c55e; --warn: #f59e0b; --danger: #ef4444;
}
[data-theme="light"] {
  --bg: #f0f9ff;
  --bg-gradient: radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.1) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.1) 0%, transparent 40%);
  --surface: rgba(255, 255, 255, 0.7);
  --surface-hover: rgba(255, 255, 255, 0.9);
  --border: rgba(0, 0, 0, 0.08);
  --brand: #0284c7;
  --brand-hover: #0369a1;
  --brand-glow: rgba(2, 132, 199, 0.3);
  --text: #0f172a;
  --text-muted: #475569;
  --shadow: 0 8px 32px rgba(2, 132, 199, 0.1);
}
* { box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  background-image: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--text);
  margin: 0;
  min-height: 100vh;
}
.glass {
  background: var(--surface);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
}
header {
  position: sticky; top: 0; z-index: 100;
  padding: 16px 24px;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;
}
.brand { font-size: 20px; font-weight: 800; text-decoration: none; color: var(--text); display: flex; align-items: center; gap: 8px; }
.brand span { color: var(--brand); }
.nav-right { display: flex; gap: 12px; align-items: center; }
.btn {
  padding: 10px 20px; border-radius: 12px; font-weight: 600; font-size: 14px;
  text-decoration: none; cursor: pointer; transition: all 0.2s ease; border: none; display: inline-flex; align-items: center; gap: 8px;
}
.btn-primary { background: var(--brand); color: #fff; box-shadow: 0 4px 14px var(--brand-glow); }
.btn-primary:hover { background: var(--brand-hover); transform: translateY(-1px); }
.btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
.btn-ghost:hover { color: var(--text); background: var(--surface-hover); }
.btn-danger { background: var(--danger); color: #fff; }
.theme-toggle {
  width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
}
main { max-width: 900px; margin: 0 auto; padding: 40px 24px 80px; }
h1 { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
.subtitle { color: var(--text-muted); margin-bottom: 32px; }
.panel { padding: 24px; border-radius: 20px; margin-bottom: 20px; }
.panel h2 { font-size: 18px; font-weight: 700; margin: 0 0 16px; }
.bolsita { padding: 20px; border-radius: 16px; margin-bottom: 16px; border: 1px solid var(--border); background: var(--surface); }
.bolsita-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
.bolsita-num { font-family: 'Inter'; font-size: 18px; font-weight: 800; color: var(--brand); }
.badge { padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; }
.badge-ok { background: rgba(34, 197, 94, 0.15); color: #22c55e; }
.badge-warn { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
.badge-muted { background: rgba(148, 163, 184, 0.15); color: #94a3b8; }
.badge-danger { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
table { width: 100%; border-collapse: collapse; margin: 12px 0; }
th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
th { color: var(--text-muted); font-size: 12px; text-transform: uppercase; font-weight: 600; }
.totals { display: flex; gap: 20px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; font-weight: 700; }
.totals .saldo { color: var(--danger); }
.empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.empty .big { font-size: 56px; margin-bottom: 12px; }
.toast {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  background: var(--surface); color: var(--text); padding: 12px 20px;
  border-radius: 12px; font-weight: 700; font-size: 14px; z-index: 400;
  box-shadow: var(--shadow); border: 1px solid var(--border);
  opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.toast.show { opacity: 1; }
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
  display: none; align-items: center; justify-content: center; z-index: 200; padding: 16px;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: var(--surface); backdrop-filter: blur(20px);
  border: 1px solid var(--border); border-radius: 20px;
  padding: 32px; width: min(420px, 100%); box-shadow: var(--shadow);
}
.modal-box h3 { font-size: 20px; margin-bottom: 16px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-muted); }
.form-group input {
  width: 100%; padding: 12px 14px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--bg);
  color: var(--text); font-size: 14px; font-family: inherit;
}
.modal-actions { display: flex; gap: 10px; margin-top: 20px; }
.modal-actions .btn { flex: 1; justify-content: center; }
@media (max-width: 640px) {
  header { padding: 12px 16px; }
  .nav-right { width: 100%; justify-content: center; }
  main { padding: 24px 16px 60px; }
}
</style>
</head>
<body>

<header class="glass">
  <a href="/" class="brand">🛍️ Tu <span>Live Shop</span></a>
  <div class="nav-right">
    <button class="theme-toggle" onclick="toggleTheme()" title="Cambiar tema" id="themeBtn">🌙</button>
    <span id="userName" style="font-weight:600"></span>
    <button class="btn btn-ghost" onclick="logout()">Salir</button>
  </div>
</header>

<main>
  <section id="view-login" class="view active">
    <div style="max-width:420px;margin:60px auto">
      <h1 style="text-align:center">🛍️ Mi Bolsita</h1>
      <p class="subtitle" style="text-align:center">Accede con tu WhatsApp y PIN</p>
      <form class="panel glass" onsubmit="clientLogin(event)" style="display:grid;gap:12px">
        <div class="form-group">
          <label>Tienda</label>
          <select id="lStore" required>
            <option value="">Selecciona...</option>
            <option value="ttshop">Pandala Kawaii</option>
          </select>
        </div>
        <div class="form-group">
          <label>WhatsApp</label>
          <input id="lWa" type="text" inputmode="numeric" placeholder="3001234567" required>
        </div>
        <div class="form-group">
          <label>PIN</label>
          <input id="lPin" type="password" inputmode="numeric" placeholder="••••" minlength="4" required>
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center">Ingresar</button>
        <div id="lErr" style="color:var(--danger);font-size:13px;text-align:center"></div>
        <p style="text-align:center;font-size:13px;color:var(--text-muted);margin-top:8px">
          ¿Primera vez? Tu PIN inicial es <b>1234</b>.
        </p>
      </form>
    </div>
  </section>

  <section id="view-dashboard" class="view" style="display:none">
    <h1>🎀 Mis Bolsitas</h1>
    <p class="subtitle">Hola, <span id="welcomeName"></span>. Aquí están tus pedidos.</p>
    <div id="ordersList"></div>
  </section>
</main>

<!-- Modal cambio de PIN -->
<div class="modal-overlay" id="pinModal">
  <div class="modal-box">
    <h3>🔐 Cambia tu PIN</h3>
    <p style="color:var(--text-muted);font-size:14px;margin-bottom:16px">Por seguridad, debes crear un nuevo PIN antes de continuar.</p>
    <form onsubmit="changePin(event)">
      <div class="form-group">
        <label>Nuevo PIN (mín. 4 dígitos)</label>
        <input id="newPin" type="password" inputmode="numeric" minlength="4" required>
      </div>
      <div class="form-group">
        <label>Confirma el PIN</label>
        <input id="newPin2" type="password" inputmode="numeric" minlength="4" required>
      </div>
      <div id="pinErr" style="color:var(--danger);font-size:13px;text-align:center"></div>
      <div class="modal-actions">
        <button type="submit" class="btn btn-primary">Guardar PIN</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
let token = localStorage.getItem('pk_token') || '';
let user = JSON.parse(localStorage.getItem('pk_user') || 'null');
let slug = new URLSearchParams(location.search).get('t') || localStorage.getItem('pk_slug') || 'ttshop';

const $ = id => document.getElementById(id);
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 3000);
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    credentials: 'include',
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}), ...(opts.headers || {}) },
    body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Error ' + res.status);
  return data;
}

const STATUS = { draft: 'Borrador', pending_confirm: 'Por confirmar', apartada: 'Apartada', paid: 'Pagada', shipped: 'Enviada', delivered: 'Entregada', canceled: 'Cancelada', expired: 'Vencida' };
const STATUS_CLASS = { draft: 'badge-warn', pending_confirm: 'badge-warn', apartada: 'badge-warn', paid: 'badge-ok', shipped: 'badge-ok', delivered: 'badge-ok', canceled: 'badge-danger', expired: 'badge-danger' };
const money = n => new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(Number(n) || 0);

function init() {
  const saved = localStorage.getItem('theme');
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = saved || (prefersDark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
  $('themeBtn').textContent = theme === 'dark' ? '🌙' : '☀️';

  if (user && token) showDashboard();
  else showLogin();
}

function showLogin() {
  $('view-login').style.display = 'block';
  $('view-dashboard').style.display = 'none';
}

function showDashboard() {
  $('view-login').style.display = 'none';
  $('view-dashboard').style.display = 'block';
  $('userName').textContent = '👋 ' + (user.name || 'Cliente');
  $('welcomeName').textContent = user.name || 'Cliente';
  loadOrders();
  if (user.must_change_pin) $('pinModal').classList.add('open');
}

async function clientLogin(e) {
  e.preventDefault();
  $('lErr').textContent = '';
  try {
    const d = await api('/api/auth/client/login', { method: 'POST', body: { whatsapp: $('lWa').value, pin: $('lPin').value, portfolio_slug: $('lStore').value } });
    token = d.token; user = d.user; slug = d.portfolio.slug;
    localStorage.setItem('pk_token', token);
    localStorage.setItem('pk_user', JSON.stringify(user));
    localStorage.setItem('pk_slug', slug);
    showDashboard();
  } catch (e) { $('lErr').textContent = e.message; }
}

function logout() {
  token = ''; user = null;
  localStorage.removeItem('pk_token');
  localStorage.removeItem('pk_user');
  localStorage.removeItem('pk_slug');
  showLogin();
}

async function loadOrders() {
  try {
    const orders = await api('/api/orders/mine');
    if (!orders || !orders.length) {
      $('ordersList').innerHTML = '<div class="empty"><div class="big">🎀</div>Aún no tienes bolsitas.<br><a href="/" class="btn btn-primary" style="margin-top:16px">Ir a la tienda</a></div>';
      return;
    }
    $('ordersList').innerHTML = orders.map(o => {
      const items = (o.items || []).map(i => `<tr><td>${i.product_name || i.kit_name || '—'}</td><td>${i.quantity}</td><td>${money(i.price)}</td><td>${money(i.price * i.quantity)}</td></tr>`).join('');
      return `<div class="bolsita">
        <div class="bolsita-header">
          <span class="bolsita-num">${o.order_number}</span>
          <span class="badge ${STATUS_CLASS[o.status] || 'badge-muted'}">${STATUS[o.status] || o.status}</span>
        </div>
        <table><thead><tr><th>Producto</th><th>Cant.</th><th>Precio</th><th>Total</th></tr></thead><tbody>${items || '<tr><td colspan="4" style="text-align:center;color:var(--text-muted)">Sin productos</td></tr>'}</tbody></table>
        <div class="totals">
          <span>Total: ${money(o.total)}</span>
          <span>Abonado: ${money(o.paid)}</span>
          <span class="saldo">Saldo: ${money(o.balance)}</span>
        </div>
      </div>`;
    }).join('');
  } catch (e) {
    $('ordersList').innerHTML = '<div class="empty">No se pudieron cargar tus bolsitas.</div>';
  }
}

async function changePin(e) {
  e.preventDefault();
  const a = $('newPin').value, b = $('newPin2').value;
  if (a.length < 4) { $('pinErr').textContent = 'El PIN debe tener al menos 4 dígitos'; return; }
  if (a !== b) { $('pinErr').textContent = 'Los PIN no coinciden'; return; }
  try {
    await api('/api/auth/client/change-pin', { method: 'POST', body: { new_pin: a } });
    $('pinModal').classList.remove('open');
    toast('✔ PIN actualizado');
    user.must_change_pin = false;
    localStorage.setItem('pk_user', JSON.stringify(user));
  } catch (e) { $('pinErr').textContent = e.message; }
}

function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  $('themeBtn').textContent = next === 'dark' ? '🌙' : '☀️';
}

init();
</script>
</body>
</html>
