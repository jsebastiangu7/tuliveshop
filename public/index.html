<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="X-Frame-Options" content="DENY">
<title>Tu Live Shop · Acceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f172a;
  --bg-gradient: radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.15) 0%, transparent 40%);
  --surface: rgba(30, 41, 59, 0.65);
  --surface-hover: rgba(51, 65, 85, 0.8);
  --border: rgba(255, 255, 255, 0.08);
  --brand: #3b82f6;
  --brand-hover: #2563eb;
  --brand-glow: rgba(59, 130, 246, 0.4);
  --text: #f8fafc;
  --text-muted: #94a3b8;
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
  --danger: #ef4444;
}
[data-theme="light"] {
  --bg: #f0f9ff;
  --bg-gradient: radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.1) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.1) 0%, transparent 40%);
  --surface: rgba(255, 255, 255, 0.7);
  --surface-hover: rgba(255, 255, 255, 0.9);
  --border: rgba(0, 0, 0, 0.08);
  --brand: #0284c7;
  --brand-hover: #0369a1;
  --brand-glow: rgba(2, 132, 199, 0.3);
  --text: #0f172a;
  --text-muted: #475569;
  --shadow: 0 8px 32px rgba(2, 132, 199, 0.1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  background-image: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.glass {
  background: var(--surface);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
}
header {
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand {
  font-size: 20px;
  font-weight: 800;
  text-decoration: none;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand span { color: var(--brand); }
.theme-toggle {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface);
  cursor: pointer;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.theme-toggle:hover { background: var(--surface-hover); }
main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.login-container {
  width: 100%;
  max-width: 440px;
  padding: 32px;
  border-radius: 24px;
}
.login-header { text-align: center; margin-bottom: 24px; }
.login-header h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
.login-header p { color: var(--text-muted); font-size: 14px; }
.profile-selector {
  display: flex;
  background: var(--bg);
  border-radius: 12px;
  padding: 4px;
  margin-bottom: 24px;
}
.profile-btn {
  flex: 1;
  padding: 10px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-weight: 600;
  font-size: 14px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
}
.profile-btn.active {
  background: var(--brand);
  color: #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.form-group { margin-bottom: 16px; }
.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--text-muted);
}
.form-group input, .form-group select {
  width: 100%;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
}
.form-group input:focus, .form-group select:focus {
  outline: none;
  border-color: var(--brand);
}
.btn {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  font-weight: 600;
  font-size: 15px;
  text-decoration: none;
  cursor: pointer;
  transition: all 0.2s ease;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-primary {
  background: var(--brand);
  color: #fff;
  box-shadow: 0 4px 14px var(--brand-glow);
}
.btn-primary:hover {
  background: var(--brand-hover);
  transform: translateY(-1px);
}
.form-error {
  color: var(--danger);
  font-size: 13px;
  min-height: 18px;
  margin-top: 8px;
  text-align: center;
}
.form-footer {
  text-align: center;
  margin-top: 16px;
  font-size: 13px;
  color: var(--text-muted);
}
.form-footer a {
  color: var(--brand);
  text-decoration: none;
  font-weight: 600;
}
.form-footer a:hover { text-decoration: underline; }
.hidden { display: none; }

/* Modal de selección de tienda */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
  padding: 16px;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: var(--surface);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 32px;
  width: min(420px, 100%);
  box-shadow: var(--shadow);
}
.modal-box h3 { font-size: 20px; margin-bottom: 16px; text-align: center; }
.store-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.store-btn {
  padding: 12px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  cursor: pointer;
  transition: all 0.2s;
  font-weight: 600;
  text-align: left;
}
.store-btn:hover {
  background: var(--brand);
  color: #fff;
  border-color: var(--brand);
}
</style>
</head>
<body>

<header>
  <a href="/landing.html" class="brand">🎥 Tu <span>Live Shop</span></a>
  <button class="theme-toggle" onclick="toggleTheme()" title="Cambiar tema" id="themeBtn">🌙</button>
</header>

<main>
  <div class="login-container glass">
    <div class="login-header">
      <h1>Bienvenido</h1>
      <p>Selecciona tu perfil para continuar</p>
    </div>

    <div class="profile-selector">
      <button class="profile-btn active" onclick="switchProfile('client')">Soy Cliente</button>
      <button class="profile-btn" onclick="switchProfile('admin')">Soy Tienda</button>
    </div>

    <!-- Formulario Cliente -->
    <form id="clientForm" onsubmit="handleClientLogin(event)">
      <div class="form-group">
        <label>WhatsApp</label>
        <input type="text" id="cliWa" inputmode="numeric" placeholder="3001234567" required>
      </div>
      <div class="form-group">
        <label>PIN</label>
        <input type="password" id="cliPin" inputmode="numeric" placeholder="••••" minlength="4" required>
      </div>
      <div class="form-error" id="cliErr"></div>
      <button type="submit" class="btn btn-primary">Ingresar como Cliente</button>
      <div class="form-footer">
        ¿No tienes cuenta? <a href="#" onclick="alert('El registro se realiza directamente desde la tienda de tu vendedor.')">Regístrate en la tienda</a>
      </div>
    </form>

    <!-- Formulario Administrador -->
    <form id="adminForm" class="hidden" onsubmit="handleAdminLogin(event)">
      <div class="form-group">
        <label>Correo electrónico</label>
        <input type="email" id="admEmail" placeholder="tu@correo.com" required>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="admPass" placeholder="••••••••" required>
      </div>
      <div class="form-error" id="admErr"></div>
      <button type="submit" class="btn btn-primary">Ingresar al Panel</button>
      <div class="form-footer">
        <a href="#" onclick="alert('Contacta al soporte para recuperar tu acceso.')">¿Olvidaste tu contraseña?</a>
      </div>
    </form>
  </div>
</main>

<!-- Modal de selección de tienda -->
<div class="modal-overlay" id="storeModal">
  <div class="modal-box">
    <h3>🏪 Selecciona tu tienda</h3>
    <p style="color: var(--text-muted); text-align: center; margin-bottom: 16px; font-size: 14px;">
      Tu número está registrado en varias tiendas. Elige a cuál quieres ingresar:
    </p>
    <div id="storeList" class="store-list"></div>
    <button class="btn" style="background: transparent; border: 1px solid var(--border); color: var(--text-muted);" onclick="closeStoreModal()">Cancelar</button>
  </div>
</div>

<script>
// Toggle de tema
function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  document.getElementById('themeBtn').textContent = next === 'dark' ? '🌙' : '☀️';
}

// Inicializar tema
(function() {
  const saved = localStorage.getItem('theme');
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = saved || (prefersDark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeBtn').textContent = theme === 'dark' ? '🌙' : '☀️';
})();

// Cambiar entre perfiles
function switchProfile(profile) {
  const btns = document.querySelectorAll('.profile-btn');
  btns.forEach(b => b.classList.remove('active'));
  
  if (profile === 'client') {
    btns[0].classList.add('active');
    document.getElementById('clientForm').classList.remove('hidden');
    document.getElementById('adminForm').classList.add('hidden');
  } else {
    btns[1].classList.add('active');
    document.getElementById('clientForm').classList.add('hidden');
    document.getElementById('adminForm').classList.remove('hidden');
  }
}

// Login de cliente (paso 1: credenciales)
async function handleClientLogin(e) {
  e.preventDefault();
  const err = document.getElementById('cliErr');
  err.textContent = 'Verificando...';
  
  try {
    const res = await fetch('/api/auth/client/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        whatsapp: document.getElementById('cliWa').value,
        pin: document.getElementById('cliPin').value
      })
    });
    
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Error al ingresar');

    // Si el cliente está en múltiples tiendas, mostrar modal de selección
    if (data.multiple_stores) {
      showStoreModal(data.multiple_stores, data);
    } else {
      // Login directo a una sola tienda
      finalizeClientLogin(data.portfolio.slug, data);
    }
  } catch (e) {
    err.textContent = e.message;
  }
}

// Mostrar modal de selección de tienda
function showStoreModal(stores, clientData) {
  const list = document.getElementById('storeList');
  list.innerHTML = stores.map(store => 
    `<button class="store-btn" onclick="finalizeClientLogin('${store.slug}', ${JSON.stringify(clientData).replace(/"/g, '&quot;')})">
      🏪 ${store.name}
    </button>`
  ).join('');
  document.getElementById('storeModal').classList.add('open');
}

// Cerrar modal
function closeStoreModal() {
  document.getElementById('storeModal').classList.remove('open');
}

// Finalizar login de cliente (paso 2: seleccionar tienda)
function finalizeClientLogin(slug, data) {
  localStorage.setItem('pk_token', data.token);
  localStorage.setItem('pk_user', JSON.stringify(data.user));
  localStorage.setItem('pk_slug', slug);
  
  closeStoreModal();
  window.location.href = '/?t=' + slug;
}

// Login de administrador
async function handleAdminLogin(e) {
  e.preventDefault();
  const err = document.getElementById('admErr');
  err.textContent = 'Verificando...';
  
  try {
    const res = await fetch('/api/auth/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('admEmail').value,
        password: document.getElementById('admPass').value
      })
    });
    
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Credenciales inválidas');
    
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    if (data.portfolio) localStorage.setItem('portfolio', JSON.stringify(data.portfolio));
    
    window.location.href = '/admin.html';
  } catch (e) {
    err.textContent = e.message;
  }
}
</script>
</body>
</html>
