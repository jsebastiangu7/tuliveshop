<style>
:root{
  --bg:#fff4ec; --bg2:#ffe9f1; --surface:#ffffff; --ink:#33203a; --muted:#8a6f8f; --border:#f3d7e2;
  --primary:#7c5cff; --pink:#ff5c8a; --mint:#1fc993; --amber:#ffab1a; --blue:#38bdf8; --danger:#ff4d6d;
  --grad:linear-gradient(120deg,#ff5c8a,#7c5cff 52%,#38bdf8);
  --grad2:linear-gradient(120deg,#ffab1a,#ff5c8a 60%,#7c5cff);
  --shadow:0 20px 60px rgba(124,92,255,.18);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow-x:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3,.brand{font-family:'Baloo 2',cursive;line-height:1.12}
a{color:inherit}
::selection{background:var(--pink);color:#fff}
*{scrollbar-width:thin;scrollbar-color:var(--primary) rgba(124,92,255,.14)}
::-webkit-scrollbar{width:11px}
::-webkit-scrollbar-track{background:rgba(124,92,255,.12)}
::-webkit-scrollbar-thumb{background:var(--grad);border-radius:9px;border:2px solid var(--bg)}
.wrap{max-width:1140px;margin:0 auto;padding:0 20px}
.btn{display:inline-flex;align-items:center;gap:9px;border:0;border-radius:14px;padding:14px 24px;font-weight:800;font-size:15px;cursor:pointer;text-decoration:none;transition:transform .14s,box-shadow .2s}
.btn:hover{transform:translateY(-2px)}
.btn.primary{background:var(--grad);color:#fff;box-shadow:0 12px 30px rgba(124,92,255,.4)}
.btn.wa{background:#25d366;color:#06341c;box-shadow:0 12px 30px rgba(37,211,102,.35)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--border)}
.btn.lg{padding:17px 32px;font-size:17px}

.aurora i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:drift 18s ease-in-out infinite}
