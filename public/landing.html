<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pandala Kawaii · El sistema de bolsitas para tu emprendimiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8ef;--surface:#fff;--ink:#241f31;--muted:#7a7288;--border:#efe4d4;--brand:#7c5cff;--pink:#ff5c8a;--amber:#f59e0b}
[data-theme="dark"]{--bg:#16131f;--surface:#201b2e;--ink:#f3eefc;--muted:#a99fc0;--border:#372e52}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:'Nunito',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;
  background-image:radial-gradient(1000px 600px at 0% 0%,rgba(124,92,255,.14),transparent 55%),radial-gradient(900px 600px at 100% 10%,rgba(255,92,138,.12),transparent 55%)}
h1,h2,.brand{font-family:'Baloo 2',cursive}
header{display:flex;align-items:center;gap:14px;padding:16px 24px;background:color-mix(in srgb,var(--surface) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.brand{font-size:22px;font-weight:800;text-decoration:none;color:var(--ink)}.brand b{color:var(--brand)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center}
.hero-title{font-size:clamp(32px,6vw,52px);line-height:1.1;margin:0 0 16px}
.hero-title .grad{background:linear-gradient(135deg,var(--brand),var(--pink),var(--amber));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-sub{font-size:18px;color:var(--muted);max-width:600px;margin:0 auto 40px}
.btn-group{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 28px;border-radius:14px;font:inherit;font-weight:800;font-size:16px;text-decoration:none;transition:.2s;border:none;cursor:pointer}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--pink));color:#fff;box-shadow:0 8px 24px rgba(124,92,255,.35)}
.btn.primary:hover{transform:translateY(-2px)}
.btn.outline{background:var(--surface);color:var(--ink);border:2px solid var(--border)}
.btn.outline:hover{border-color:var(--brand);color:var(--brand)}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-back.open{display:flex}
.modal{background:var(--surface);border-radius:20px;padding:28px;width:min(400px,100%);text-align:left}
.modal h3{margin:0 0 16px;text-align:center}
.modal input,.modal select{width:100%;padding:12px;border:1.5px solid var(--border);border-radius:10px;font:inherit;margin-bottom:12px;background:var(--bg);color:var(--ink)}
.modal .btn{width:100%;justify-content:center;margin-top:8px}
footer{text-align:center;padding:24px;color:var(--muted);font-size:13px;border-top:1px solid var(--border)}
</style>
</head>
<body>

<header>
  <a href="/" class="brand">🐼 Pandala <b>Kawaii</b></a>
  
  <!-- BOTONES AGREGADOS A LA DERECHA -->
  <div style="display: flex; gap: 12px; margin-left: auto; align-items: center;">
    <a href="/?t=ttshop" class="btn outline" style="font-size: 14px; padding: 10px 20px;">🛍️ Ingreso como Cliente</a>
    <a href="/admin.html" class="btn primary" style="font-size: 14px; padding: 10px 20px;">🏪 Ingreso como Tienda</a>
  </div>
</header>

<main>
  <h1 class="hero-title">Tu negocio, <span class="grad">organizado y en línea</span></h1>
  <p class="hero-sub">El sistema de bolsitas, inventario y logística diseñado para emprendedores que venden por apartados.</p>
  
  <div class="btn-group">
    <button class="btn primary" onclick="openStoreLogin()">🏪 Ingreso como Tienda (Admin)</button>
    <button class="btn outline" onclick="openClientLogin()">🛍️ Ingreso como Cliente</button>
  </div>
</main>

<!-- Modal Admin -->
<div id="modalAdmin" class="modal-back">
  <div class="modal">
    <h3>🏪 Acceso Administrador</h3>
    <form onsubmit="handleAdminLogin(event)">
      <input type="email" id="admEmail" placeholder="Correo electrónico" required>
      <input type="password" id="admPass" placeholder="Contraseña" required>
      <button type="submit" class="btn primary">Ingresar al panel</button>
      <button type="button" class="btn outline" onclick="closeModals()" style="margin-top:8px">Cancelar</button>
    </form>
  </div>
</div>

<!-- Modal Cliente -->
<div id="modalClient" class="modal-back">
  <div class="modal">
    <h3>🛍️ Acceso Cliente</h3>
    <form onsubmit="handleClientLogin(event)">
      <input type="text" id="cliWa" inputmode="numeric" placeholder="Tu número de WhatsApp" required>
      <input type="password" id="cliPin" inputmode="numeric" placeholder="Tu PIN" required>
      <select id="cliStore" required>
        <option value="">Selecciona tu tienda...</option>
        <option value="ttshop">Pandala Kawaii (Demo)</option>
      </select>
      <button type="submit" class="btn primary">Ingresar a la tienda</button>
      <button type="button" class="btn outline" onclick="closeModals()" style="margin-top:8px">Cancelar</button>
    </form>
  </div>
</div>

<footer>© 2026 Pandala Kawaii · Hecho con 💜 para emprendedores</footer>

<script>
function openStoreLogin() { document.getElementById('modalAdmin').classList.add('open'); }
function openClientLogin() { document.getElementById('modalClient').classList.add('open'); }
function closeModals() { document.querySelectorAll('.modal-back').forEach(m => m.classList.remove('open')); }

async function handleAdminLogin(e) {
  e.preventDefault();
  try {
    const res = await fetch('/api/auth/admin/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: document.getElementById('admEmail').value, password: document.getElementById('admPass').value })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    window.location.href = '/admin.html';
  } catch (err) { alert('Error: ' + err.message); }
}

async function handleClientLogin(e) {
  e.preventDefault();
  const whatsapp = document.getElementById('cliWa').value;
  const pin = document.getElementById('cliPin').value;
  const portfolio_slug = document.getElementById('cliStore').value;
  if (!portfolio_slug) return alert('Por favor selecciona una tienda');
  
  try {
    const res = await fetch('/api/auth/client/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ whatsapp, pin, portfolio_slug })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    localStorage.setItem('pk_token', data.token);
    localStorage.setItem('pk_user', JSON.stringify(data.user));
    localStorage.setItem('pk_slug', data.portfolio.slug);
    if (data.must_change_pin) alert('Debes cambiar tu PIN inicial. Serás redirigido.');
    window.location.href = '/?t=' + data.portfolio.slug;
  } catch (err) { alert('Error: ' + err.message); }
}
</script>
</body>
</html>
