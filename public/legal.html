<!DOCTYPE html>
<html lang="es-419">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Términos, Privacidad y Datos Personales | Tu Live Shop</title>
<meta name="description" content="Términos y condiciones, política de privacidad y política de tratamiento de datos personales de Tu Live Shop.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://tuliveshop.onrender.com/legal">
<meta name="theme-color" content="#1D4ED8">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/img/icon-192.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8FAFC;--card:#fff;--text:#0F172A;--muted:#475569;--line:#E2E8F0;--brand:#1D4ED8}
@media (prefers-color-scheme:dark){:root{--bg:#0B1120;--card:#0F172A;--text:#F1F5F9;--muted:#94A3B8;--line:#1E293B;--brand:#38BDF8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Nunito,system-ui,sans-serif;line-height:1.65}
header{position:sticky;top:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:5}
.bar{max-width:880px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar img{height:44px;width:auto;border-radius:8px;display:block;background:#fff;padding:0 6px}
.bar a.back{font-weight:700;color:var(--brand);text-decoration:none;font-size:.92rem}
main{max-width:880px;margin:0 auto;padding:20px 16px 60px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tabs button,.tabs select{font:inherit;font-weight:700;padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
@media (prefers-color-scheme:dark){.tabs button.on{color:#0B1120}}
article{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px}
h2{font-family:Montserrat,sans-serif;font-size:1.6rem;margin:.2em 0 .4em}
h3{font-family:Montserrat,sans-serif;font-size:1.05rem;margin:1.6em 0 .3em}
.meta{color:var(--muted);font-size:.9rem}
li{margin:.3em 0}a{color:var(--brand)}
</style>
</head>
<body>
<header><div class="bar">
  <a href="/" aria-label="Tu Live Shop - Inicio"><img src="/img/logo.png" width="720" height="322" alt="Tu Live Shop"></a>
  <a class="back" href="/">← Volver al inicio</a>
</div></header>
<main>
  <div class="tabs" role="tablist">
    <button type="button" id="t-terminos" onclick="show('terms')">Términos y condiciones</button>
    <button type="button" id="t-privacidad" onclick="show('privacy')">Política de privacidad</button>
    <button type="button" id="t-datos" onclick="show('data')">Datos personales</button>
    <select id="lang" onchange="render()" aria-label="Idioma"><option value="es">Español</option><option value="en">English</option></select>
  </div>
  <article id="doc"></article>
</main>
<script src="/legal-docs.js?v=2"></script>
<script>
var MAP = { terminos: 'terms', privacidad: 'privacy', datos: 'data' }, cur = MAP[location.hash.slice(1)] || 'terms';
function render() {
  var lang = document.getElementById('lang').value;
  document.getElementById('doc').innerHTML = (window.LEGAL_DOCS[cur] || window.LEGAL_DOCS.terms)[lang];
  Object.keys(MAP).forEach(function (k) { document.getElementById('t-' + k).classList.toggle('on', MAP[k] === cur); });
  document.documentElement.lang = lang === 'en' ? 'en' : 'es-419';
}
function show(k) { cur = k; var h = Object.keys(MAP).find(function (x) { return MAP[x] === k; }); history.replaceState(null, '', '#' + h); render(); window.scrollTo(0, 0); }
window.addEventListener('hashchange', function () { cur = MAP[location.hash.slice(1)] || cur; render(); });
render();
</script>
</body>
</html>
